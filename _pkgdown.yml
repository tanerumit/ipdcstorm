url: https://tanerumit.github.io/ipdcstorm/
title: ipdcstorm

template:
  bootstrap: 5

navbar:
  structure:
    left: [home, intro, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/tutorial_1_setup.html

home:
  sidebar:
    structure: [links, license, community, citation, authors, dev]

articles:
  - title: Tutorials
    navbar: Tutorials
    contents:
      - tutorial_1_setup
      - tutorial_2_validation
      - tutorial_3_climate_change
      - tutorial_4_stress_test

reference:
  - title: Core hazard workflow
    contents:
      - make_hazard_cfg
      - run_hazard_model

  - title: Climate scenario tools
    contents:
      - make_climate_cfg
      - resolve_climate_inputs

  - title: Validation
    contents:
      - make_validation_cfg
      - validate_hazard_model
      - run_validation_suite

  - title: IBTrACS and storm inputs
    contents:
      - ibtracs_demo
      - read_ibtracs_clean
      - query_storm_track_years
      - lookup_storm_id
      - make_storm_events
      - compute_storm_heading

  - title: Downscaling and Impact
    contents:
      - build_event_library
      - make_background_wind_cfg
      - generate_daily_hazard_impact_spatial
      - damage_rate_from_wind
      - save_daily_hazard_csvs

  - title: Query and Stress Testing
    contents:
      - query_impact_years
      - query_aftermath_impact
      - compute_stress_year_metrics
      - aggregate_stress_metrics
      - select_stress_years

  - title: Visualization
    contents:
      - starts_with("plot_")
      - save_hazard_viz_plots

repo:
  url:
    home: https://github.com/tanerumit/ipdcstorm/
    source: https://github.com/tanerumit/ipdcstorm/blob/main/
    issue: https://github.com/tanerumit/ipdcstorm/issues/
    user: https://github.com/
  branch: main
